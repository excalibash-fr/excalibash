services:
  excalibash:
    build: .
    image: excalibash:latest
    container_name: excalibash
    restart: unless-stopped
    ports:
      # Local only by default: put a reverse proxy in front, or expose the ports (see README).
      # BIND_ADDR=0.0.0.0 exposes the ports on every interface (LAN access, self-signed HTTPS).
      - "${BIND_ADDR:-127.0.0.1}:6767:6767"
      # Separate origin for web tunnels (sites of the machines), isolated from Excalibash itself.
      - "${BIND_ADDR:-127.0.0.1}:6768:6768"
    environment:
      # Public URL, used in the agent install commands (e.g. https://excalibash.example.com)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # "true" forces Secure cookies (only needed behind a proxy that does not send X-Forwarded-Proto)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # HTTPS on both ports: "auto" (TLS_CERT/TLS_KEY, or a self-signed certificate kept in /data/tls)
      # or "off" (plain HTTP, behind a reverse proxy that does TLS)
      TLS: ${TLS:-auto}
      # PEM certificate and key paths inside the container (mount them as a volume)
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      # Extra names/IPs for the self-signed certificate, comma-separated (e.g. the host's LAN name and IP)
      TLS_SANS: ${TLS_SANS:-}
      # Public URL of the web-tunnel origin behind a reverse proxy (e.g. https://tunnel.example.com)
      PROXY_URL: ${PROXY_URL:-}
      # Optional: one origin per tunnel, https://<id>.<TUNNEL_DOMAIN>/ (needs PUBLIC_URL and a reverse proxy that
      # sends X-Tunnel-Host and X-Tunnel-Auth: see the README). TUNNEL_PROXY_SECRET: 32 characters at least.
      TUNNEL_DOMAIN: ${TUNNEL_DOMAIN:-}
      TUNNEL_PROXY_SECRET: ${TUNNEL_PROXY_SECRET:-}
      TUNNEL_SCHEME: ${TUNNEL_SCHEME:-https}
      TUNNEL_SESSION_HOURS: ${TUNNEL_SESSION_HOURS:-8}
      # Outgoing email for sign-up verification codes (put the real values in .env, not here).
      # Without SMTP_HOST, new accounts are not email-verified.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      # "true" for port 465 (implicit TLS)
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Sender, e.g. "Excalibash <no-reply@example.com>"
      SMTP_FROM: ${SMTP_FROM:-}
      # Shown on the privacy page
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      LEGAL_NAME: ${LEGAL_NAME:-}
      # Global cap on new accounts per hour (anti-abuse)
      REGISTRATIONS_PER_HOUR: ${REGISTRATIONS_PER_HOUR:-50}
      # Code for the first (admin) account. Random and printed in the logs when empty.
      SETUP_CODE: ${SETUP_CODE:-}
    volumes:
      - excalibash-data:/data

volumes:
  excalibash-data:
